<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mariana & Hernán · WhatsApp</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f9f6f0;color:#173656}
    main{max-width:520px;padding:28px;text-align:center}
    a{display:inline-block;margin-top:16px;padding:12px 18px;border-radius:10px;background:#173656;color:#fff;text-decoration:none}
    p{line-height:1.5}
  </style>
</head>
<body>
<main>
  <p id="status">Abrindo o WhatsApp…</p>
  <a id="fallback" href="#" hidden>Abrir WhatsApp</a>
</main>
<script>
(() => {
  const p = new URLSearchParams(location.search);
  const phone = (p.get('phone') || '').replace(/\D/g, '');
  const token = (p.get('token') || '').trim();

  if (!phone || !/^mh27-[a-z0-9]+$/i.test(token)) {
    document.getElementById('status').textContent = 'Link inválido.';
    return;
  }

  const rsvp = 'https://marianayhernan.web.app/rsvp/' + encodeURIComponent(token);
  const gifts = 'https://marianayhernan.web.app';

  const message = `Oi! 💛 Finalmente chegou a hora: vamos nos casar!

Sabemos que estamos a muitos quilômetros de distância, mas seria muito especial ter vocês com a gente nesse dia. E, se não for possível vir, sabemos que de alguma forma vocês estarão com a gente mesmo de longe.

Estamos enviando o nosso convite com todos os detalhes do casamento. Para confirmar a presença, é só acessar o RSVP até o dia 30 de novembro:

RSVP 💛
${rsvp}

Ter vocês com a gente nesse dia já será um presente enorme. Mas, se quiserem também nos presentear de outra forma, montamos uma lista com algumas experiências da nossa lua de mel:

Nossa viagem ✈️
${gifts}

Um beijo,
Mariana & Hernán`;

  const encoded = encodeURIComponent(message);
  const appTarget = 'whatsapp://send?phone=' + encodeURIComponent(phone) + '&text=' + encoded;
  const webTarget = 'https://api.whatsapp.com/send?phone=' + encodeURIComponent(phone) + '&text=' + encoded;

  const fallback = document.getElementById('fallback');
  fallback.href = webTarget;
  fallback.hidden = false;

  // Mobile-first: open the installed WhatsApp app directly. This avoids
  // intermediary HTTP redirects that can corrupt 4-byte emoji characters.
  // If the custom scheme is not handled, keep a visible HTTPS fallback.
  location.href = appTarget;
})();
</script>
</body>
</html>
