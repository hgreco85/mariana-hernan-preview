name = "mp-webhook"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
# Active Apps Script deployment URL (Web App staging v36)
APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx5YvudciPjG0OUmqSjOocMHxLMFZy2MTN9V3VrBb5FQP_VK1B7O3T3z8aiZP574K1E/exec"
# Strict Orders API mode (no automatic fallback to preferences)
MP_API_MODE = "orders"
# Set to 'true' only when authorized for live payments; default 'false' (sandbox/staging)
LIVE_MODE = "false"
# Return URL after Mercado Pago checkout
APP_URL = "https://marianayhernan.web.app/"
# Used as notification_url for payment Orders / Webhooks
WORKER_WEBHOOK_URL = "https://mp-webhook.hgreco85.workers.dev"

# SENSITIVE SECRETS: Do NOT place secret values in this file!
# Production/staging secrets stay in Cloudflare (`wrangler secret put <NAME>`).
# Local sandbox only: `node ../scripts/load-mp-local-secrets.mjs` writes gitignored
# .dev.vars (MP_ACCESS_TOKEN, MP_WEBHOOK_SECRET) for `wrangler dev`. Never commit it.
# - SHARED_SECRET
# - MP_ACCESS_TOKEN
# - MP_WEBHOOK_SECRET

# PRODUCTION ENVIRONMENT CONFIGURATION (Separated resource & trigger, USD 0 incremental cost)
# Deployment command: npx wrangler deploy --env production
# Secrets: npx wrangler secret put <NAME> --env production
[env.production]
name = "mp-webhook-production"
[env.production.vars]
APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx5YvudciPjG0OUmqSjOocMHxLMFZy2MTN9V3VrBb5FQP_VK1B7O3T3z8aiZP574K1E/exec"
MP_API_MODE = "orders"
# LIVE_MODE enabled under explicit human authorization for GRECOHERNAN (84725274)
LIVE_MODE = "true"
APP_URL = "https://marianayhernan.web.app/"
WORKER_WEBHOOK_URL = "https://mp-webhook-production.hgreco85.workers.dev"
