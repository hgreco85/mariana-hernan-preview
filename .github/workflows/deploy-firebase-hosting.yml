name: Deploy Firebase Hosting

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_HG_MARKET_SYSTEM: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HG_MARKET_SYSTEM }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_HG_MARKET_SYSTEM"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_HG_MARKET_SYSTEM" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Hosting
        run: firebase deploy --only hosting:marianayhernan --project hg-market-system --non-interactive
