name: Wedding gift featured-paid preview contract
on:
  pull_request:
    paths:
      - 'Code.js'
      - 'preview.html'
      - 'tests/featured-paid-gift.test.mjs'
      - '.github/workflows/featured-paid-gift-test.yml'
permissions:
  contents: read
jobs:
  preview-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/featured-paid-gift.test.mjs
