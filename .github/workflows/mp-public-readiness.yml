name: Wedding public readiness only
on:
  push:
    branches:
      - audit/wedding-mp-public-readiness-20261108
permissions:
  contents: write
jobs:
  safe-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public HTTP endpoints, no credentials or payments
        run: python3 scripts/mp-public-readiness.py
      - name: Persist metadata-only outcome to audit branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -f mp_public_readiness.json || exit 0
          git add mp_public_readiness.json
          git diff --cached --quiet || git commit -m "Public readiness receipt [skip ci]"
          git push
